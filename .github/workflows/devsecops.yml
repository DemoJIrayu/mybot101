# DevSecOps pipeline for mybot101. The jobs live in devsecops-reusable.yml, which the
# other repos the agent team works on call too (see docs/onboarding/).
#
# Check names in branch protection look like "devsecops / secrets";
# set them with: bash .github/scripts/protect-main.sh

name: devsecops

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * 1"      # weekly full scan, Monday 09:17 Bangkok time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devsecops:
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: write
    uses: ./.github/workflows/devsecops-reusable.yml
    with:
      # The original BotTeam demo: scanned, but not gated, built or tested.
      exclude_dirs: botadmin,botoffice,rakazo,docs
      codeql_languages: '["python","javascript-typescript"]'
