# DevSecOps pipeline for the mybot101 rebuild: Python, Node/TypeScript, Next.js.
#
# - Security scans cover the WHOLE repo (findings go to the Security tab).
# - Blocking checks and build/test cover only NEW code; the legacy BotTeam demo
#   folders are listed in .github/scripts/projects.sh.
# - Each stack job skips until that stack exists.
#
# Free for public repos: Actions minutes, CodeQL, secret scanning, Dependabot.
# Pin third-party actions to full commit SHAs over time; Dependabot keeps them updated.

name: devsecops

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * 1"      # weekly full scan, Monday 09:17 Bangkok time
  workflow_dispatch:

permissions:
  contents: read              # least privilege by default; jobs opt in to more

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LEGACY_EXCLUDES: botadmin,botoffice,rakazo,docs

jobs:
  # ---------- 0. Which stacks exist in the new code? ----------
  detect:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.d.outputs.python }}
      node: ${{ steps.d.outputs.node }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          chmod +x .github/scripts/projects.sh
          py=$(.github/scripts/projects.sh pyproject.toml requirements.txt)
          js=$(.github/scripts/projects.sh package.json)
          {
            echo "python=$([ -n "$py" ] && echo true || echo false)"
            echo "node=$([ -n "$js" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "Python projects: ${py:-none}"
          echo "Node projects:   ${js:-none}"

  # ---------- 1. Secrets (whole repo, full history, blocking) ----------
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- 2. Static analysis ----------
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Report (whole repo, never fails)
        run: semgrep scan --config p/default --config p/secrets --sarif --output semgrep.sarif || true
      - name: Gate (new code only, fails on ERROR findings)
        run: |
          excludes=""
          for d in $(echo "$LEGACY_EXCLUDES" | tr ',' ' '); do excludes="$excludes --exclude=$d"; done
          # shellcheck disable=SC2086
          semgrep scan --config p/default --config p/secrets --severity ERROR --error $excludes
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  # ---------- 3. Dependencies, Dockerfiles, compose ----------
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # Tags before 0.35.0 were hijacked in the March 2026 supply-chain attack
      # (GHSA-69fq-xp46-6x23). Stay on 0.35.0+ and ideally pin its commit SHA.
      - name: Report (whole repo)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Gate (new code only)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: ${{ env.LEGACY_EXCLUDES }}
          exit-code: "1"

  # ---------- 4. Build and test new code ----------
  python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint, audit, test each Python project
        run: |
          bash .github/scripts/projects.sh pyproject.toml requirements.txt | while IFS= read -r dir; do
            echo "::group::$dir"
            ( cd "$dir"
              uv venv -q && . .venv/bin/activate
              if [ -f pyproject.toml ]; then uv pip install -q -e ".[dev]" 2>/dev/null || uv pip install -q -e .; fi
              if [ -f requirements.txt ]; then uv pip install -q -r requirements.txt; fi
              uv pip install -q ruff pytest pip-audit
              ruff check .
              uv pip freeze --exclude-editable > /tmp/reqs.txt   # audit deps, not the project itself
              pip-audit --strict --disable-pip --no-deps -r /tmp/reqs.txt || echo "::warning::pip-audit found issues in $dir"
              pytest -q || [ $? -eq 5 ]   # exit 5 = no tests collected yet
            )
            echo "::endgroup::"
          done

  node:
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm 11.10+ enforces .npmrc min-release-age and blocks unreviewed install
      # scripts; Node 22 ships npm 10, which silently ignores both.
      - run: npm install -g npm@11.20.0
      - name: Install, lint, type-check, test, build each Node / Next.js project
        run: |
          bash .github/scripts/projects.sh package.json | while IFS= read -r dir; do
            echo "::group::$dir"
            ( cd "$dir"
              if [ -f package-lock.json ]; then npm ci; else npm install --no-audit; fi
              npm audit --audit-level=high --omit=dev || echo "::warning::npm audit found issues in $dir"
              npm run lint --if-present
              npm run typecheck --if-present
              npm test --if-present
              npm run build --if-present
            )
            echo "::endgroup::"
          done

  e2e:
    needs: [detect, node]
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm 11.10+ enforces .npmrc min-release-age and blocks unreviewed install
      # scripts; Node 22 ships npm 10, which silently ignores both.
      - run: npm install -g npm@11.20.0
      - name: Playwright end-to-end tests (where a playwright config exists)
        run: |
          bash .github/scripts/projects.sh 'playwright.config.*' | while IFS= read -r dir; do
            echo "::group::$dir"
            ( cd "$dir"; npm ci; npx playwright install --with-deps chromium; npx playwright test )
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: "**/playwright-report/"
          retention-days: 7
