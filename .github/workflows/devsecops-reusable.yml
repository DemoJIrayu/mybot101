# Shared DevSecOps pipeline. Every repo the agent team works on calls this file:
#
#   jobs:
#     devsecops:
#       uses: DemoJIrayu/mybot101/.github/workflows/devsecops-reusable.yml@main
#       with: { postgres: true, redis: true }
#
# Checks: secrets (gitleaks), Semgrep, Trivy, CodeQL + dependency review (needs GitHub
# Advanced Security on private repos; turn off with code_scanning: false), and for each
# Python / Node / Next.js project: lint, type-check, unit tests, build, Playwright e2e.
# Test databases are throwaway containers with random passwords, started per job.

name: devsecops (reusable)

on:
  workflow_call:
    inputs:
      exclude_dirs:
        description: "Comma-separated folders that are scanned but not gated, built or tested (legacy code)"
        type: string
        default: ""
      code_scanning:
        description: "CodeQL, SARIF upload to the Security tab and dependency review (private repos need GitHub Advanced Security)"
        type: boolean
        default: true
      codeql_languages:
        description: 'CodeQL languages as JSON, e.g. ["javascript-typescript","python"]'
        type: string
        default: '["javascript-typescript"]'
      node_version:
        type: string
        default: "22"
      postgres:
        type: boolean
        default: false
      mysql:
        type: boolean
        default: false
      mongodb:
        type: boolean
        default: false
      redis:
        type: boolean
        default: false

permissions:
  contents: read

env:
  EXCLUDES: ${{ inputs.exclude_dirs }}
  # Lists project folders that contain one of the given files, skipping dependency
  # folders and the excluded (legacy) folders. Usage: bash -c "$PROJECTS" _ package.json
  PROJECTS: |
    set -euo pipefail
    prune=(-path ./.git -o -name node_modules -o -name .venv -o -name .next -o -name dist)
    IFS=',' read -ra ex <<< "${EXCLUDES:-}"
    for d in "${ex[@]}"; do d="${d// /}"; [ -n "$d" ] && prune+=(-o -path "./$d"); done
    names=(); for n in "$@"; do names+=(-name "$n" -o); done; unset 'names[${#names[@]}-1]'
    find . \( "${prune[@]}" \) -prune -o \( "${names[@]}" \) -type f -print0 \
      | xargs -0 -r -n1 dirname | sort -u
  # Starts the requested test databases with random passwords and exports their URLs
  # (DATABASE_URL, MYSQL_URL, MONGODB_URI, REDIS_URL) for the following steps.
  START_DBS: |
    set -euo pipefail
    wait_for() { for _ in $(seq 60); do if eval "$1" >/dev/null 2>&1; then return 0; fi; sleep 2; done; echo "$2 did not start" >&2; exit 1; }
    if [ "$WANT_POSTGRES" = "true" ]; then
      pw=$(openssl rand -hex 12)
      docker run -d --name pg -e POSTGRES_USER=app -e POSTGRES_PASSWORD="$pw" -e POSTGRES_DB=app_test -p 5432:5432 postgres:16-alpine
      wait_for "docker exec pg pg_isready -U app" postgres
      echo "DATABASE_URL=postgresql://app:${pw}@localhost:5432/app_test" >> "$GITHUB_ENV"
    fi
    if [ "$WANT_MYSQL" = "true" ]; then
      pw=$(openssl rand -hex 12)
      docker run -d --name my -e MYSQL_ROOT_PASSWORD="$pw" -e MYSQL_DATABASE=app_test -e MYSQL_USER=app -e MYSQL_PASSWORD="$pw" -p 3306:3306 mysql:8.4
      wait_for "docker exec my mysqladmin ping -h 127.0.0.1 -uapp -p$pw --silent" mysql
      echo "MYSQL_URL=mysql://app:${pw}@127.0.0.1:3306/app_test" >> "$GITHUB_ENV"
    fi
    if [ "$WANT_MONGODB" = "true" ]; then
      docker run -d --name mongo -p 27017:27017 mongo:7
      wait_for "docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok'" mongodb
      echo "MONGODB_URI=mongodb://localhost:27017/app_test" >> "$GITHUB_ENV"
    fi
    if [ "$WANT_REDIS" = "true" ]; then
      docker run -d --name redis -p 6379:6379 redis:7-alpine
      wait_for "docker exec redis redis-cli ping" redis
      echo "REDIS_URL=redis://localhost:6379" >> "$GITHUB_ENV"
    fi
  WANT_POSTGRES: ${{ inputs.postgres }}
  WANT_MYSQL: ${{ inputs.mysql }}
  WANT_MONGODB: ${{ inputs.mongodb }}
  WANT_REDIS: ${{ inputs.redis }}

jobs:
  # ---------- 0. Which stacks exist? ----------
  detect:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.d.outputs.python }}
      node: ${{ steps.d.outputs.node }}
      e2e: ${{ steps.d.outputs.e2e }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: d
        run: |
          py=$(bash -c "$PROJECTS" _ pyproject.toml requirements.txt)
          js=$(bash -c "$PROJECTS" _ package.json)
          pw=$(bash -c "$PROJECTS" _ 'playwright.config.*')
          {
            echo "python=$([ -n "$py" ] && echo true || echo false)"
            echo "node=$([ -n "$js" ] && echo true || echo false)"
            echo "e2e=$([ -n "$pw" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "Python projects: ${py:-none}"
          echo "Node projects:   ${js:-none}"
          echo "Playwright:      ${pw:-none}"

  # ---------- 1. Secrets (full history, blocking) ----------
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- 2. Static analysis ----------
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Report (whole repo, never fails)
        if: inputs.code_scanning
        run: semgrep scan --config p/default --config p/secrets --sarif --output semgrep.sarif || true
      - name: Gate (fails on ERROR findings outside excluded folders)
        run: |
          excludes=""
          for d in $(echo "$EXCLUDES" | tr ',' ' '); do excludes="$excludes --exclude=$d"; done
          # shellcheck disable=SC2086
          semgrep scan --config p/default --config p/secrets --severity ERROR --error $excludes
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: always() && inputs.code_scanning
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  codeql:
    if: inputs.code_scanning
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.codeql_languages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # A new or empty repo has no code in this language yet: CodeQL would fail with
      # "could not process any code", so skip it (the check still passes) until there is.
      - name: Any ${{ matrix.language }} code?
        id: src
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          case "$LANGUAGE" in
            python) globs=('*.py') ;;
            javascript-typescript) globs=('*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.mts' '*.cts' '*.vue') ;;
            *) globs=('*') ;;
          esac
          if [ -n "$(git ls-files -- "${globs[@]}" | head -1)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No $LANGUAGE files yet; CodeQL skipped."
          fi
      - if: steps.src.outputs.found == 'true'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - if: steps.src.outputs.found == 'true'
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4

  # ---------- 3. Dependencies, Dockerfiles, compose ----------
  dependency-review:
    if: github.event_name == 'pull_request' && inputs.code_scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Tags before 0.35.0 were hijacked in the March 2026 supply-chain attack
      # (GHSA-69fq-xp46-6x23). Stay on 0.35.0+ and ideally pin its commit SHA.
      - name: Report (whole repo)
        if: inputs.code_scanning
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: always() && inputs.code_scanning
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Gate (outside excluded folders)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: ${{ inputs.exclude_dirs }}
          exit-code: "1"

  # ---------- 4. Build and test ----------
  python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Start test databases
        run: bash -c "$START_DBS"
      - name: Lint, audit, test each Python project
        run: |
          bash -c "$PROJECTS" _ pyproject.toml requirements.txt | while IFS= read -r dir; do
            echo "::group::$dir"
            ( cd "$dir"
              uv venv -q && . .venv/bin/activate
              if [ -f pyproject.toml ]; then uv pip install -q -e ".[dev]" 2>/dev/null || uv pip install -q -e .; fi
              if [ -f requirements.txt ]; then uv pip install -q -r requirements.txt; fi
              uv pip install -q ruff pytest pip-audit
              ruff check .
              uv pip freeze --exclude-editable > /tmp/reqs.txt   # audit deps, not the project itself
              pip-audit --strict --disable-pip --no-deps -r /tmp/reqs.txt || echo "::warning::pip-audit found issues in $dir"
              pytest -q || [ $? -eq 5 ]   # exit 5 = no tests collected yet
            )
            echo "::endgroup::"
          done

  node:
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node_version }}
      # npm 11.10+ enforces min-release-age and blocks unreviewed install scripts;
      # Node 22 ships npm 10, which silently ignores both. The user-level setting
      # covers every project folder, with or without its own .npmrc.
      - run: |
          npm install -g npm@11.20.0
          npm config set min-release-age 7 --location=user
      - name: Start test databases
        run: bash -c "$START_DBS"
      - name: Install, audit, lint, type-check, test, build each Node / Next.js project
        env:
          # Without GitHub Advanced Security there's no dependency review, so npm audit gates.
          STRICT_AUDIT: ${{ !inputs.code_scanning }}
        run: |
          bash -c "$PROJECTS" _ package.json | while IFS= read -r dir; do
            # npm workspaces: a member without its own lockfile is handled by the root.
            if [ ! -f "$dir/package-lock.json" ]; then
              parent=$(dirname "$dir"); covered=false
              while [ "$parent" != "." ] && [ "$parent" != "/" ]; do
                [ -f "$parent/package-lock.json" ] && covered=true && break
                parent=$(dirname "$parent")
              done
              [ -f "./package-lock.json" ] && [ "$dir" != "." ] && covered=true
              if [ "$covered" = true ]; then echo "skip $dir (npm workspace member)"; continue; fi
            fi
            echo "::group::$dir"
            ( cd "$dir"
              if [ -f package-lock.json ]; then npm ci; else npm install --no-audit; fi
              if [ "$STRICT_AUDIT" = "true" ]; then
                npm audit --audit-level=high --omit=dev
              else
                npm audit --audit-level=high --omit=dev || echo "::warning::npm audit found issues in $dir"
              fi
              npm run lint --if-present
              npm run typecheck --if-present
              npm test --if-present
              npm run build --if-present
            )
            echo "::endgroup::"
          done

  e2e:
    needs: [detect, node]
    if: needs.detect.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node_version }}
      - run: |
          npm install -g npm@11.20.0
          npm config set min-release-age 7 --location=user
      - name: Start test databases
        run: bash -c "$START_DBS"
      - name: Playwright end-to-end tests (where a playwright config exists)
        run: |
          bash -c "$PROJECTS" _ 'playwright.config.*' | while IFS= read -r dir; do
            echo "::group::$dir"
            ( cd "$dir"; npm ci; npx playwright install --with-deps chromium; npx playwright test )
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: "**/playwright-report/"
          retention-days: 7
