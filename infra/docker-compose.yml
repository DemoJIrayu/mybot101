# Agent team — base services (step 1).
# Memory limits add up to ~3.5 GB, inside the 8 GB WSL cap.
#
#   docker compose up -d                          # LiteLLM + Postgres
#   docker compose --profile sandbox up -d        # also start the 3 agent sandboxes
#   docker compose --profile sandbox stop         # stop sandboxes when idle to free RAM
#
# Every port is bound to 127.0.0.1 only.

name: agent-team

# Test databases for the agents (profile "databases"). Throwaway data in memory, no
# ports on your machine, reachable only from the sandboxes. Never real data.
x-test-db-env: &test-db-env
  DATABASE_URL: postgresql://app:${TEST_DB_PASSWORD:-agent-test-only}@test-postgres:5432/app_test
  MYSQL_URL: mysql://app:${TEST_DB_PASSWORD:-agent-test-only}@test-mysql:3306/app_test
  MONGODB_URI: mongodb://test-mongo:27017/app_test
  REDIS_URL: redis://test-redis:6379

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [core-net]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 10s
      retries: 5

  # One OpenAI-compatible endpoint for all agents. Routes model aliases
  # (lead / worker) to DeepSeek models, enforces the
  # monthly budget, and logs tokens per agent key.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      DATABASE_URL: postgresql://agent:${POSTGRES_PASSWORD}@postgres:5432/agent
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}   # optional; not used by default models
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [core-net]
    mem_limit: 1g

  # Agent sandboxes: where agents run code, tests and Playwright.
  # They hold NO keys at all: the agent loop runs on your machine and only uses
  # `docker exec` to act in here. They also can't reach LiteLLM or Postgres
  # (separate network), only the internet.
  sandbox-lead: &sandbox
    profiles: ["sandbox"]
    build: ./sandbox
    image: agent-team/sandbox:latest
    restart: "no"
    environment:
      <<: *test-db-env
      AGENT_ROLE: lead
    volumes:
      - ws-lead:/workspace
    networks: [sandbox-net]
    mem_limit: 768m
    cpus: 2
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=256m"]

  sandbox-dev:
    <<: *sandbox
    environment:
      <<: *test-db-env
      AGENT_ROLE: dev
    volumes:
      - ws-dev:/workspace
    mem_limit: 1536m          # builds Next.js / runs tests

  sandbox-qa:
    <<: *sandbox
    environment:
      <<: *test-db-env
      AGENT_ROLE: qa
    volumes:
      - ws-qa:/workspace
    mem_limit: 1536m          # headless Chromium for Playwright
    shm_size: 512m

  # ---- test databases: docker compose --profile databases up -d ----
  test-postgres:
    profiles: ["databases"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-agent-test-only}
      POSTGRES_DB: app_test
    tmpfs: ["/var/lib/postgresql/data"]
    networks: [sandbox-net]
    mem_limit: 256m

  test-mysql:
    profiles: ["databases"]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${TEST_DB_PASSWORD:-agent-test-only}
      MYSQL_DATABASE: app_test
      MYSQL_USER: app
      MYSQL_PASSWORD: ${TEST_DB_PASSWORD:-agent-test-only}
    tmpfs: ["/var/lib/mysql"]
    networks: [sandbox-net]
    mem_limit: 512m

  test-mongo:
    profiles: ["databases"]
    image: mongo:7
    command: ["--wiredTigerCacheSizeGB", "0.25", "--bind_ip_all"]
    tmpfs: ["/data/db"]
    networks: [sandbox-net]
    mem_limit: 512m

  test-redis:
    profiles: ["databases"]
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [sandbox-net]
    mem_limit: 64m

networks:
  core-net:            # LiteLLM + Postgres
    driver: bridge
  sandbox-net:         # agent sandboxes: internet only
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24   # infra/wsl/lan-block.sh relies on this

volumes:
  pgdata:
  ws-lead:
  ws-dev:
  ws-qa:
